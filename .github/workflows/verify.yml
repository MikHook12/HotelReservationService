name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and HTTP tests
        run: ./mvnw -B test
      - name: Require Docker for infrastructure tests
        run: docker info
      - name: PostgreSQL, Kafka and MongoDB integration tests
        run: ./mvnw -B -Pintegration verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
