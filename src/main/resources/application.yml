spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: HotelReservationService

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_db}
    username: ${DB_USER:hotel_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  springdoc:
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      tryItOutEnabled: true
      operationsSorter: method
      tagsSorter: alpha
    api-docs:
      enabled: true
      path: /v3/api-docs

  data:
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:adminpass}@localhost:27017/${MONGO_DB:hotel_statistics}?authSource=admin

    kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      consumer:
        group-id: statistics-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.trusted.packages: "*"

  security:
    user:
      password: testpass