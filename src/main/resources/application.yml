spring:
  # запускается application-local.yml
  profiles:
    active: local

  config:
    import: optional:file:.env[.properties]
  application:
    name: HotelReservationService
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_db}
    username: ${DB_USER:hotel_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#     отключить перед продом
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
